<text x="320" y="830" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="start" fill="#546E7A">La potencia del NEMA-17 viene de la fuente externa de 12 V a través del A4988 (ver diagrama de potencia).</text>
