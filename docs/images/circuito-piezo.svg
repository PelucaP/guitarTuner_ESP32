<text x="80" y="668" font-family="DejaVu Sans" font-size="13" font-weight="bold" text-anchor="start" fill="#37474F">Lista de valores</text>
<text x="80" y="696" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" text-anchor="start" fill="#E65100">P1</text>
<text x="138" y="696" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#37474F">disco piezo 27 mm, ≈25 nF</text>
<text x="800" y="696" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" text-anchor="start" fill="#E65100">C1</text>
<text x="858" y="696" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#37474F">100 nF · acoplo (fc ≈6 Hz con R1)</text>
<text x="80" y="720" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" text-anchor="start" fill="#E65100">R1</text>
<text x="138" y="720" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#37474F">1 MΩ · polariza la entrada (no usar &lt; 1 M)</text>
<text x="800" y="720" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" text-anchor="start" fill="#E65100">Bias</text>
<text x="858" y="720" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#37474F">divisor 10k/10k + 10 µF + 100 nF</text>
<text x="80" y="744" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" text-anchor="start" fill="#E65100">U1</text>
<text x="138" y="744" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#37474F">MCP6002 (rail-to-rail, 3,3 V)</text>
<text x="800" y="744" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" text-anchor="start" fill="#E65100">Rf/Rg</text>
<text x="858" y="744" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#37474F">91k / 10k por etapa (×10,1)</text>
<text x="80" y="768" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" text-anchor="start" fill="#E65100">LPF</text>
<text x="138" y="768" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#37474F">1 kΩ + 39 nF → 4,1 kHz</text>
<text x="800" y="768" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" text-anchor="start" fill="#E65100">D1</text>
<text x="858" y="768" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#37474F">BAT54S + 1 kΩ en serie al ADC</text>
<rect x="60" y="806" width="1440" height="62" rx="10" fill="#FFF8E1" stroke="#EF6C00" stroke-width="1.6"/>
<text x="80" y="830" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="start" fill="#4E342E">¿Por qué no usar un divisor de 100 kΩ? El piezo es una fuente capacitiva de ≈25 nF;</text>
<text x="80" y="850" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="start" fill="#4E342E">con menos de 1 MΩ el corte sube a ≈64 Hz y se pierde la 6ª cuerda (82,4 Hz).</text>
